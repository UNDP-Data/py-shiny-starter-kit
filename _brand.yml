# This file is an abridged version of undp-brand-yml with only parts relevant
# to the PyShiny Starter Kit.
# See https://github.com/UNDP-Data/undp-brand-yml for details.

# Use the meta section to configure application metadata
meta:
  header:
    region:
      text: Region
      href: null
    title:
      text: Site Title
      href: null
    logo: undp
  footer:
    logo: undp
color:
  palette:
    black: "#000000"
    white: "#FFFFFF"
    # https://design.undp.org/?path=/docs/foundation-colors--docs
    # primary colours
    blue-100: "#B5D5F5"
    blue-200: "#94C4F5"
    blue-300: "#6BABEB"
    blue-400: "#4F95DD"
    blue-500: "#3288CE"
    blue-600: "#0468B1" # UNDP Blue
    blue-700: "#1F5A95"
    gray-100: "#FAFAFA"
    gray-200: "#F7F7F7"
    gray-300: "#EDEFF0"
    gray-400: "#D4D6D8"
    gray-500: "#A9B1B7"
    gray-600: "#55606E"
    gray-700: "#232E3D"
    # accent colours
    light-yellow: "#FFEB00"
    yellow: "#FFEB00"
    dark-yellow: "#FBC412"
    light-red: "#FFBCB7"
    red: "#EE402D"
    dark-red: "#D12800"
    light-green: "#B8ECB6"
    green: "#6DE354"
    dark-green: "#59BA47"
    light-azure: "#A2DAF3"
    azure: "#60D4F2"
    dark-azure: "#00C1FF"
    # extra colours from https://cdn.jsdelivr.net/npm/@undp/design-system/docs/css/base-minimal.min.css
    light-pink: "#FFB4AE"
    silvery-moonlight: "#CED0D3"
    shuttle-gray: "#55606F"
    ebony-clay: "#232E3E"
    # SDG colours from https://www.un.org/sustainabledevelopment/news/communications-material/
    sdg-1: "#E5243B"
    sdg-2: "#DDA63A"
    sdg-3: "#4C9F38"
    sdg-4: "#C5192D"
    sdg-5: "#FF3A21"
    sdg-6: "#26BDE2"
    sdg-7: "#FCC30B"
    sdg-8: "#A21942"
    sdg-9: "#FD6925"
    sdg-10: "#DD1367"
    sdg-11: "#FD9D24"
    sdg-12: "#BF8B2E"
    sdg-13: "#3F7E44"
    sdg-14: "#0A97D9"
    sdg-15: "#56C02B"
    sdg-16: "#00689D"
    sdg-17: "#19486A"
  foreground: black
  background: white
  primary: blue-600
  secondary: gray-200
  tertiary: dark-red
  success: light-green
  info: light-azure
  warning: light-red
  danger: red
  light: white
  dark: gray-700
